<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Drift Runner</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; background: #0a0e14; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #e8eef5;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none; touch-action: none; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated;
        image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
